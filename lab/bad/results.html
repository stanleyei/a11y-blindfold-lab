<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../favicon.ico" sizes="any">
<title>小舖 B</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="../../assets/js/icons.js"></script>
<script defer src="../../assets/js/sr-sim.js"></script>
<script defer src="../../assets/js/shop.js"></script>
<script defer src="../../assets/js/tasks.js"></script>
<style>*:focus{outline:none !important}</style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
<button type="button" id="task-replay" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:bg-amber-500 focus:text-slate-900 focus:font-bold focus:px-4 focus:py-2 focus:rounded">重聽任務說明</button>

<div class="bg-violet-700 text-white text-xs text-center py-1"><span data-site-icon="celebration"></span> 夏日特賣進行中！全館 8 折，滿千免運 <span data-site-icon="celebration"></span></div>
<div class="bg-white shadow-sm">
  <div class="max-w-6xl mx-auto px-6 py-3 flex flex-wrap items-center gap-5">
    <a href="index.html"><img src="../../assets/img/logo_final_v3.svg" width="120" height="36" class="h-9"></a>
    <div class="flex-1 flex flex-wrap gap-4 text-sm">
      <a href="index.html" class="hover:text-violet-700">首頁</a>
      <a href="results.html" class="hover:text-violet-700">商品</a>
      <a href="results.html?q=耳機" class="hover:text-violet-700">耳機</a>
      <a href="results.html?q=生活" class="hover:text-violet-700">生活</a>
      <a href="results.html?q=文具" class="hover:text-violet-700">文具</a>
      <a href="results.html" class="hover:text-violet-700">新品</a>
      <a href="index.html#sale" class="hover:text-violet-700">特賣</a>
      <a href="#" class="hover:text-violet-700">品牌故事</a>
      <a href="#" class="hover:text-violet-700">門市</a>
      <a href="#" class="hover:text-violet-700">會員</a>
      <a href="#" class="hover:text-violet-700">客服</a>
      <a href="#" class="hover:text-violet-700">部落格</a>
    </div>
    <form action="results.html" method="get" class="relative">
      <input id="q" name="q" type="text" class="border rounded-full pl-4 pr-10 py-2 w-48 bg-slate-100">
      <div class="absolute right-3 top-2.5 cursor-pointer text-slate-500" onclick="this.parentNode.submit()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div>
    </form>
    <div class="cursor-pointer relative text-slate-700" onclick="location.href='checkout.html'">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
      <span id="cart-count" class="absolute -top-2 -right-2 bg-violet-600 text-white text-xs rounded-full w-5 h-5 grid place-items-center">0</span>
    </div>
  </div>
</div>

<div class="max-w-6xl mx-auto px-6 py-8">
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <div id="h-title" class="text-3xl font-black text-violet-800">搜尋結果</div>
      <div id="count" class="text-slate-500 text-sm mt-1"></div>
    </div>
    <div class="flex items-center gap-4 text-sm">
      <span class="text-violet-700 underline cursor-pointer" onclick="openShipping()">運費說明</span>
      <div class="bg-violet-600 text-white px-4 py-2 rounded-full cursor-pointer font-bold" onclick="location.href='checkout.html'">前往結帳 →</div>
    </div>
  </div>
  <div id="list" class="mt-6 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
  <div id="empty" hidden class="mt-6 text-slate-500">沒有符合的商品</div>
</div>

<div class="bg-slate-900 text-slate-300 mt-12">
  <div class="max-w-6xl mx-auto px-6 py-8 grid gap-6 md:grid-cols-3 text-sm">
    <div><div class="font-bold text-white mb-2">關於我們</div><p>想知道更多品牌故事？<a href="#" class="text-violet-300 underline">點這裡</a></p></div>
    <div><div class="font-bold text-white mb-2">客戶服務</div><p>退換貨政策請<a href="#" class="text-violet-300 underline">點這裡</a>，常見問題請<a href="#" class="text-violet-300 underline">點這裡</a></p></div>
    <div><div class="font-bold text-white mb-2">工作坊</div><a href="../../index.html" class="text-violet-300 underline">回工作坊首頁</a></div>
  </div>
</div>
<div id="toast" class="fixed bottom-24 right-6 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg opacity-0 transition-opacity pointer-events-none"></div>
<aside id="task-panel" class="fixed top-14 right-4 w-64 bg-white/95 border border-amber-300 rounded-xl shadow p-3 text-slate-700" aria-hidden="true"></aside>

<script>
function openShipping() {
  var overlay = document.createElement('div');
  overlay.id = 'ship-overlay';
  overlay.className = 'fixed inset-0 bg-black/50 grid place-items-center z-40';
  overlay.innerHTML =
    '<div class="bg-white rounded-2xl p-6 max-w-md w-full relative shadow-2xl">' +
      '<div class="absolute top-3 right-4 text-2xl text-slate-400 cursor-pointer" onclick="closeShipping()">×</div>' +
      '<div class="text-xl font-bold text-violet-800">運費說明</div>' +
      '<div class="mt-3 text-slate-700 space-y-1">' +
        '<div>宅配：全台一律 80 元，滿 1,500 元免運。</div>' +
        '<div>超商取貨：60 元，滿 1,000 元免運。</div>' +
        '<div>門市自取：免運。</div>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);
  document.dispatchEvent(new CustomEvent('shop:dialog', { detail: { open: true } }));
}
function closeShipping() {
  var o = document.getElementById('ship-overlay'); if (o) o.remove();
  document.dispatchEvent(new CustomEvent('shop:dialog', { detail: { open: false } }));
}
document.addEventListener('DOMContentLoaded', function () {
  var q = Shop.query('q');
  var items = Shop.search(q);
  document.getElementById('h-title').textContent = q ? '「' + q + '」' : '全部商品';
  document.getElementById('q').value = q;
  document.getElementById('count').textContent = items.length + ' 項商品';
  function card(p) {
    return '<div class="bg-white rounded-2xl shadow overflow-hidden flex flex-col">' +
      '<img src="../../assets/img/' + p.img + '" width="400" height="300" class="w-full aspect-[4/3] object-cover">' +
      '<div class="p-4 flex-1 flex flex-col">' +
        '<div class="font-bold text-lg">' + p.name + '</div>' +
        '<div class="text-sm text-slate-500 mt-1">' + p.desc + '</div>' +
        '<div class="mt-2 flex items-center justify-between">' +
          '<span class="font-black text-violet-700">' + Shop.money(p.price) + '</span>' +
          '<button type="button" data-add="' + p.id + '" class="bg-violet-600 hover:bg-violet-700 text-white w-10 h-10 rounded-full grid place-items-center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg></button>' +
        '</div>' +
      '</div></div>';
  }
  document.getElementById('list').innerHTML = items.map(card).join('');
  document.getElementById('empty').hidden = items.length > 0;
  function updateCount() { document.getElementById('cart-count').textContent = Shop.cartCount(); }
  updateCount();
  var toast = document.getElementById('toast'), t;
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-add]'); if (!b) return;
    var p = Shop.byId(b.dataset.add); Shop.addToCart(p.id); updateCount();
    toast.innerHTML = SiteIcons.svg('check', 'mr-1') + ' 已加入購物車'; toast.style.opacity = 1; clearTimeout(t); t = setTimeout(function () { toast.style.opacity = 0; }, 1800);
  });
});
</script>
</body>
</html>
